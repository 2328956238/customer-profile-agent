name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m customer_profile_agent.demo
      - run: python -m customer_profile_agent.outbox_demo
      - run: python -m customer_profile_agent.support_demo
      - run: python -m customer_profile_agent.knowledge fixtures/knowledge/synthetic-v1.json
      - run: python -m customer_profile_agent.evals fixtures/evals/synthetic-v1.json
